packages:
  - apps/*
  - crates/*
  - packages/*

catalogMode: prefer

catalog:
  '@fontsource-variable/geist': ^5.3.0
  '@lucide/svelte': ^1.55.0
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@tailwindcss/vite': ^4.3.3
  svelte: ^5.57.2
  svelte-check: ^4.7.6
  tailwindcss: ^4.3.3
  # svelte-check supports TypeScript 5 and 6 only; stay on 6 until it supports 7.
  typescript: ^6.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
